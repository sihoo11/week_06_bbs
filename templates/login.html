{% extends "base.html" %}

{% block title %}로그인{% endblock %}

{% block content %}
    <h1>로그인</h1>

    {% if error %}
    <div style="background: #fee; border: 1px solid #fcc; color: #c00; padding: 12px; border-radius: 6px; margin-bottom: 20px;">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
        <div style="margin-bottom: 16px;">
            <label for="username" style="display: block; margin-bottom: 8px; font-weight: 500; color: #333;">아이디</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div style="margin-bottom: 20px;">
            <label for="password" style="display: block; margin-bottom: 8px; font-weight: 500; color: #333;">비밀번호</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">로그인</button>
    </form>

    <div style="margin-top: 20px; text-align: center; color: #666; font-size: 14px;">
        계정이 없나요? <a href="/signup" style="color: #667eea; font-weight: 500;">회원가입</a>
    </div>
{% endblock %}
