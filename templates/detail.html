{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <div class="nav">
        <a href="/" class="back-btn">← 목록으로</a>
    </div>

    <div class="post-header">
        <h1>{{ post.title }}</h1>
        <div class="post-meta">{{ post.created_at }}</div>
    </div>

    <div class="post-content">
        {{ post.content }}
    </div>

    {% if session.get("user_id") == post.user_id %}
    <div class="post-actions">
        <a href="/posts/{{ post.id }}/edit">✏️ 수정</a>
        <form method="POST" action="/posts/{{ post.id }}/delete" onsubmit="return confirm('정말 삭제하시겠습니까?')">
            <button type="submit" class="delete-btn">🗑️ 삭제</button>
        </form>
    </div>
    {% endif %}
{% endblock %}
