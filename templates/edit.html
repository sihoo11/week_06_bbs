{% extends "base.html" %}

{% block title %}글 수정{% endblock %}

{% block content %}
    <div class="nav">
        <a href="/" class="back-btn">← 목록으로</a>
    </div>

    <h1>글 수정</h1>

    <form method="POST" action="/posts/{{ post.id }}/edit">
        <input type="text" name="title" placeholder="제목을 입력하세요" value="{{ post.title }}" required>
        <textarea name="content" placeholder="내용을 입력하세요" required>{{ post.content }}</textarea>
        <button type="submit">저장</button>
    </form>
{% endblock %}
