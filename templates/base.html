<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}게시판{% endblock %}</title>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: #f9fafb;
            color: #1f2937;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            padding: 40px;
            animation: fadeIn 0.6s ease-out;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
            animation: fadeIn 0.5s ease-out;
        }

        .nav {
            margin-bottom: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .nav a, .nav button {
            display: inline-block;
            padding: 8px 14px;
            background: #f3f4f6;
            color: #1f2937;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out;
            font-weight: 500;
        }

        .nav a:hover, .nav button:hover {
            background: #e5e7eb;
            border-color: #d1d5db;
        }

        .nav .back-btn {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
        }

        .nav .back-btn:hover {
            background: #e5e7eb;
            border-color: #d1d5db;
        }

        .nav .delete-btn {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .nav .delete-btn:hover {
            background: #fecaca;
            border-color: #fca5a5;
        }

        input[type="text"], textarea, input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out;
            color: #1f2937;
            background: #f9fafb;
        }

        input[type="text"]:focus, textarea:focus, input[type="password"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: white;
        }

        textarea {
            resize: vertical;
            min-height: 200px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out;
            position: relative;
        }

        button[type="submit"]:hover {
            background: #2563eb;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        button[type="submit"]:active {
            background: #1d4ed8;
        }

        ul {
            list-style: none;
        }

        ul li {
            padding: 14px 0;
            border-bottom: 1px solid #e5e7eb;
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease-out backwards;
        }

        ul li:nth-child(1) { animation-delay: 0.05s; }
        ul li:nth-child(2) { animation-delay: 0.1s; }
        ul li:nth-child(3) { animation-delay: 0.15s; }
        ul li:nth-child(4) { animation-delay: 0.2s; }
        ul li:nth-child(5) { animation-delay: 0.25s; }
        ul li:nth-child(n+6) { animation-delay: 0.3s; }

        ul li:hover {
            background: #f9fafb;
            padding-left: 4px;
        }

        ul li:last-child {
            border-bottom: none;
        }

        ul li a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
            transition: color 0.3s ease;
        }

        ul li a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .post-meta {
            color: #6b7280;
            font-size: 12px;
        }

        .post-content {
            margin: 20px 0;
            line-height: 1.8;
            color: #1f2937;
            word-break: break-word;
            white-space: pre-line;
            animation: fadeIn 0.5s ease-out 0.2s backwards;
        }

        .post-header {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            animation: fadeIn 0.5s ease-out;
        }

        .post-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            animation: fadeIn 0.5s ease-out 0.3s backwards;
        }

        .post-actions form {
            display: inline;
        }

        .post-actions a, .post-actions button {
            display: inline-block;
            padding: 8px 14px;
            background: #f3f4f6;
            color: #1f2937;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .post-actions a:hover, .post-actions button:hover {
            background: #e5e7eb;
            border-color: #d1d5db;
        }

        .post-actions .delete-btn {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .post-actions .delete-btn:hover {
            background: #fecaca;
            border-color: #fca5a5;
        }

        .search-form {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
            animation: fadeIn 0.5s ease-out;
            flex-wrap: nowrap;
            align-items: center;
        }

        .search-form input[type="text"] {
            flex: 1;
            margin-bottom: 0;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            min-width: 0;
            transition: all 0.3s ease;
            background: #f9fafb;
            color: #1f2937;
            height: auto;
        }

        .search-form input[type="text"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: white;
        }

        .search-form button {
            padding: 8px 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
            height: auto;
            width: 50px;
        }

        .search-form button:hover {
            background: #2563eb;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        .search-result {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 14px;
            color: #1f2937;
            animation: fadeIn 0.5s ease-out;
            transition: all 0.3s ease;
        }

        .search-result:hover {
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.1);
            transform: translateX(4px);
        }

        .search-result a {
            margin-left: 12px;
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .search-result a:hover {
            color: #1e40af;
            text-decoration: underline;
        }

        .nav-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            animation: fadeIn 0.5s ease-out;
        }

        .nav-left-top {
            display: flex;
            gap: 12px;
            align-items: center;
            animation: fadeIn 0.5s ease-out 0.05s backwards;
        }

        .nav-left-top a {
            display: inline-block;
            padding: 8px 12px;
            background: #f3f4f6;
            color: #1f2937;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            border: 1px solid #e5e7eb;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-left-top a:hover {
            background: #e5e7eb;
            border-color: #d1d5db;
        }

        .nav-right-top {
            display: flex;
            gap: 10px;
            align-items: center;
            animation: fadeIn 0.5s ease-out 0.1s backwards;
        }

        .nav-right-top a, .nav-right-top button, .nav-right-top span {
            display: inline-block;
            padding: 8px 12px;
            font-size: 13px;
            text-decoration: none;
            color: #1f2937;
            transition: all 0.3s ease;
        }

        .nav-right-top a {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-right-top a:hover {
            background: #e5e7eb;
            border-color: #d1d5db;
        }

        .nav-right-top button {
            padding: 8px 12px;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-right-top button:hover {
            background: #fecaca;
            border-color: #fca5a5;
        }

        .nav-right-top form {
            display: inline;
        }

        .username {
            color: #1f2937;
            font-size: 13px;
            font-weight: 500;
        }

        .auth-container {
            max-width: 400px;
            margin: 40px auto;
            animation: fadeIn 0.5s ease-out;
        }

        .auth-form {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #1f2937;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
            color: #1f2937;
            background: #f9fafb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: white;
        }

        .auth-form button {
            width: 100%;
            padding: 10px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .auth-form button:hover {
            background: #2563eb;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        .auth-links {
            text-align: center;
            margin-top: 20px;
        }

        .auth-links a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .auth-links a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .success-message {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #166534;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .comments-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e5e7eb;
            animation: fadeIn 0.5s ease-out 0.4s backwards;
        }

        .comments-section h2 {
            font-size: 20px;
            color: #1f2937;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .comment-form {
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease-out;
        }

        .comment-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            color: #1f2937;
            background: #f9fafb;
        }

        .comment-form textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: white;
        }

        .comment-form button {
            padding: 10px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .comment-form button:hover {
            background: #2563eb;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        .login-prompt {
            background: #dbeafe;
            border: 1px solid #93c5fd;
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
            color: #1f2937;
            font-size: 14px;
        }

        .login-prompt a {
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-prompt a:hover {
            color: #1e40af;
            text-decoration: underline;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .comment {
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease-out backwards;
        }

        .comment:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .comment:nth-child(1) { animation-delay: 0.1s; }
        .comment:nth-child(2) { animation-delay: 0.15s; }
        .comment:nth-child(3) { animation-delay: 0.2s; }
        .comment:nth-child(n+4) { animation-delay: 0.25s; }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 12px;
        }

        .comment-author {
            font-weight: 600;
            color: #1f2937;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .comment-date {
            color: #9ca3af;
            font-size: 12px;
        }

        .comment-content {
            color: #1f2937;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-line;
            margin: 0;
        }

        .comment-delete {
            display: inline;
        }

        .comment-delete-btn {
            padding: 6px 10px;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .comment-delete-btn:hover {
            background: #fecaca;
            border-color: #fca5a5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-header-top">
            <div class="nav-left-top">
                {% block nav_left %}{% endblock %}
            </div>
            <div class="nav-right-top">
                {% if session.get("user_id") %}
                    <span class="username">{{ session.get("username") }}님</span>
                    <a href="/change-password">🔐 비밀번호 변경</a>
                    <form method="POST" action="/logout">
                        <button type="submit">로그아웃</button>
                    </form>
                {% else %}
                    <a href="/login">로그인</a>
                    <a href="/signup">회원가입</a>
                {% endif %}
            </div>
        </div>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
