<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}게시판{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .nav {
            margin-bottom: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav a, .nav button {
            display: inline-block;
            padding: 10px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .nav a:hover, .nav button:hover {
            background: #764ba2;
        }

        .nav .back-btn {
            background: #999;
        }

        .nav .back-btn:hover {
            background: #666;
        }

        .nav .delete-btn {
            background: #e74c3c;
        }

        .nav .delete-btn:hover {
            background: #c0392b;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 200px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button[type="submit"]:hover {
            background: #764ba2;
        }

        ul {
            list-style: none;
        }

        ul li {
            padding: 16px;
            border-bottom: 1px solid #eee;
            transition: background 0.3s ease;
        }

        ul li:hover {
            background: #f8f9fa;
        }

        ul li:last-child {
            border-bottom: none;
        }

        ul li a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
        }

        ul li a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .post-meta {
            color: #999;
            font-size: 12px;
        }

        .post-content {
            margin: 20px 0;
            line-height: 1.8;
            color: #333;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .post-header {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .post-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .post-actions form {
            display: inline;
        }

        .search-form {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            width: 100%;
        }

        .search-form input[type="text"] {
            flex: 1;
            margin-bottom: 0;
            padding: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            height: 70px;
            min-width: 300px;
        }

        .search-form button {
            padding: 0 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            white-space: nowrap;
        }

        .search-form button:hover {
            background: #764ba2;
        }

        .search-result {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
        }

        .search-result a {
            margin-left: 12px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .search-result a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
