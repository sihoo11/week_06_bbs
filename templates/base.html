<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}게시판{% endblock %}</title>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes shimmer {
            0% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(102, 126, 234, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            animation: fadeIn 0.6s ease-out;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
            animation: slideInLeft 0.5s ease-out;
        }

        .nav {
            margin-bottom: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav a, .nav button {
            display: inline-block;
            padding: 10px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: slideInLeft 0.5s ease-out;
        }

        .nav a:hover, .nav button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .nav .back-btn {
            background: #999;
            animation: slideInLeft 0.5s ease-out;
        }

        .nav .back-btn:hover {
            background: #666;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(153, 153, 153, 0.4);
        }

        .nav .delete-btn {
            background: #e74c3c;
            animation: slideInLeft 0.5s ease-out 0.05s backwards;
        }

        .nav .delete-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.4);
        }

        input[type="text"], textarea, input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out;
        }

        input[type="text"]:focus, textarea:focus, input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        textarea {
            resize: vertical;
            min-height: 200px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out;
            position: relative;
        }

        button[type="submit"]:hover {
            background: #764ba2;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(-1px);
        }

        ul {
            list-style: none;
        }

        ul li {
            padding: 16px;
            border-bottom: 1px solid #eee;
            transition: all 0.3s ease;
            animation: slideInLeft 0.4s ease-out backwards;
        }

        ul li:nth-child(1) { animation-delay: 0.05s; }
        ul li:nth-child(2) { animation-delay: 0.1s; }
        ul li:nth-child(3) { animation-delay: 0.15s; }
        ul li:nth-child(4) { animation-delay: 0.2s; }
        ul li:nth-child(5) { animation-delay: 0.25s; }
        ul li:nth-child(n+6) { animation-delay: 0.3s; }

        ul li:hover {
            background: #f8f9fa;
            transform: translateX(4px);
            box-shadow: -3px 0 0 #667eea;
        }

        ul li:last-child {
            border-bottom: none;
        }

        ul li a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
            transition: color 0.3s ease;
        }

        ul li a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .post-meta {
            color: #999;
            font-size: 12px;
        }

        .post-content {
            margin: 20px 0;
            line-height: 1.8;
            color: #333;
            word-break: break-word;
            white-space: pre-wrap;
            animation: fadeIn 0.5s ease-out 0.2s backwards;
        }

        .post-header {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
            animation: slideInLeft 0.5s ease-out;
        }

        .post-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            animation: fadeIn 0.5s ease-out 0.3s backwards;
        }

        .post-actions form {
            display: inline;
        }

        .post-actions a, .post-actions button {
            transition: all 0.3s ease;
        }

        .post-actions a:hover {
            transform: translateY(-2px);
        }

        .search-form {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            width: 100%;
            animation: fadeIn 0.5s ease-out;
            flex-wrap: nowrap;
        }

        .search-form input[type="text"] {
            flex: 1;
            margin-bottom: 0;
            padding: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            height: 70px;
            min-width: 0;
            transition: all 0.3s ease;
        }

        .search-form input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .search-form button {
            padding: 0 8px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
            height: 70px;
            width: 65px;
        }

        .search-form button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .search-result {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #333;
            animation: fadeIn 0.5s ease-out;
            transition: all 0.3s ease;
        }

        .search-result:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateX(4px);
        }

        .search-result a {
            margin-left: 12px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .search-result a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .auth-nav {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .auth-nav form {
            display: inline;
        }

        .auth-nav button {
            padding: 8px 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out;
        }

        .auth-nav button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .auth-nav a {
            display: inline-block;
            padding: 8px 14px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out;
        }

        .auth-nav a:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .username {
            padding: 8px 14px;
            color: #333;
            font-size: 13px;
            background: #f0f4ff;
            border-radius: 6px;
            animation: fadeIn 0.5s ease-out;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="auth-nav">
        {% if session.get("user_id") %}
            <span class="username">{{ session.get("username") }}</span>
            <form method="POST" action="/logout">
                <button type="submit">로그아웃</button>
            </form>
        {% else %}
            <a href="/login">로그인</a>
            <a href="/signup">회원가입</a>
        {% endif %}
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
