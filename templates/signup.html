{% extends "base.html" %}

{% block title %}회원가입{% endblock %}

{% block content %}
    <h1>회원가입</h1>

    {% if error %}
    <div style="background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/signup">
        <div style="margin-bottom: 16px;">
            <label for="username" style="display: block; margin-bottom: 8px; font-weight: 500; color: #1f2937;">아이디</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div style="margin-bottom: 20px;">
            <label for="password" style="display: block; margin-bottom: 8px; font-weight: 500; color: #1f2937;">비밀번호</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">회원가입</button>
    </form>

    <div style="margin-top: 20px; text-align: center; color: #6b7280; font-size: 14px;">
        이미 계정이 있나요? <a href="/login" style="color: #3b82f6; font-weight: 500; text-decoration: none;">로그인</a>
    </div>
{% endblock %}
