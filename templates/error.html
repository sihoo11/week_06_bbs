{% extends "base.html" %}

{% block title %}오류{% endblock %}

{% block nav_left %}
    <a href="/">← 목록으로</a>
{% endblock %}

{% block content %}
    <div class="error-page">
        <div class="error-code">{{ status }}</div>
        <p>{{ message }}</p>
        {% if status in (401, 403) and not session.get("user_id") %}
            <a href="{{ url_for('login', next=request.full_path) }}" class="room-manage-btn">로그인하기</a>
        {% else %}
            <a href="javascript:history.back()" class="room-manage-btn">뒤로 가기</a>
        {% endif %}
    </div>
{% endblock %}
